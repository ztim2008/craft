<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Редактор страниц</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%232271b1' width='32' height='32' rx='6'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body, #app { margin: 0; height: 100%; }
    body { font: 14px/1.45 system-ui, sans-serif; background: #f0f0f1; color: #1d2327; }
    .login { max-width: 360px; margin: 10vh auto; background: #fff; border: 1px solid #c3c4c7; border-radius: 8px; padding: 16px; }
    .shell { display: grid; grid-template-rows: 52px minmax(0, 1fr); height: 100%; }
    .top { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1d2327; color: #f0f0f1; }
    .top h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
    .top .grow { flex: 1; }
    .top button, .top a { border: 0; background: transparent; color: inherit; font: inherit; padding: 8px 10px; border-radius: 4px; cursor: pointer; text-decoration: none; }
    .top button:disabled { opacity: 0.4; cursor: default; }
    .top button:hover, .top a:hover, .top .on { background: #2271b1; }
    .primary { background: #2271b1 !important; color: #fff !important; }
    .ghost { background: #fff !important; color: #2271b1 !important; }
    .work { display: grid; grid-template-columns: 240px minmax(0, 1fr) 320px; min-height: 0; }
    .pages { overflow: hidden; background: #fff; border-right: 1px solid #dcdcde; padding: 12px; display: flex; flex-direction: column; min-height: 0; }
    .side { overflow: auto; background: #fff; border-left: 1px solid #dcdcde; padding: 12px; }
    #page-list { flex: none; max-height: 32%; overflow: auto; }
    #outline-list { flex: 1; min-height: 0; overflow: auto; margin-top: 4px; }
    .out-btn { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: #fff; padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit; margin-bottom: 4px; }
    .out-btn:hover { background: #f0f0f1; }
    .out-btn.on { border-color: #2271b1; background: #f0f6fc; }
    .out-btn.is-hidden { opacity: 0.55; }
    .out-btn.is-insert { border-left: 3px solid #dba617; }
    .stage { min-width: 0; min-height: 0; background: #c3c4c7; display: flex; flex-direction: column; }
    .stage-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #fff; border-bottom: 1px solid #dcdcde; }
    .stage-bar button { border: 1px solid #c3c4c7; background: #fff; color: #1d2327; font: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .stage-bar .grow { flex: 1; }
    .stage-frame { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; }
    .stage-frame[data-vp="desktop"] iframe { width: 100%; height: 100%; }
    .stage-frame[data-vp="mobile"] iframe { width: 390px; height: 100%; flex: none; background: #fff; box-shadow: 0 0 0 1px #8c8f94; }
    .stage iframe { border: 0; background: #fff; }
    .modal { position: fixed; inset: 0; background: rgba(29,35,39,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    .modal.on { display: flex; }
    .modal .card { width: min(640px, 100%); max-height: 90vh; overflow: auto; }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .modal button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid #c3c4c7; background: #fff; cursor: pointer; }
    .panel { flex: 1; overflow: auto; padding: 16px; }
    .page-btn { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: #fff; padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; margin-bottom: 6px; }
    .page-btn:hover { background: #f0f0f1; }
    .page-btn.on { border-color: #2271b1; background: #f0f6fc; }
    .path { color: #50575e; font-size: 12px; }
    label { display: block; margin: 10px 0; }
    label span { display: block; font-size: 11px; text-transform: uppercase; color: #50575e; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #8c8f94; border-radius: 6px; font: inherit; }
    textarea { min-height: 88px; font-family: ui-monospace, monospace; }
    .muted { color: #50575e; font-size: 13px; }
    .err { color: #d63638; }
    .ok { color: #00a32a; }
    .card { background: #fff; border: 1px solid #c3c4c7; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    pre { white-space: pre-wrap; font-size: 12px; }
    .hint { font-size: 13px; color: #50575e; margin: 0 0 12px; }
    #craft-dbg { position: fixed; bottom: 0; left: 0; right: 0; z-index: 99999; max-height: 30vh; overflow: auto; background: #1d2327; color: #f0c14b; font: 12px/1.4 ui-monospace, monospace; padding: 8px 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app"></div>
  <pre id="craft-dbg" hidden></pre>
  <script>
    const dbgLines = [];
    function dbg(msg) {
      dbgLines.push(new Date().toISOString().slice(11, 19) + " " + String(msg));
      if (dbgLines.length > 50) dbgLines.shift();
      try { console.log("[craft]", msg); } catch (err) {}
    }
    window.addEventListener("error", (e) => {
      dbg("JS " + e.message + " " + (e.filename || "") + ":" + e.lineno + ":" + e.colno);
    });
    window.addEventListener("unhandledrejection", (e) => {
      const r = e.reason;
      dbg("Promise " + (r && r.message ? r.message : r));
    });
    dbg("admin script parsed");
    document.getElementById("craft-dbg").addEventListener("click", () => {
      document.getElementById("craft-dbg").hidden = true;
    });

    const state = {
      view: "edit",
      content: null,
      model: null,
      leads: [],
      status: "",
      error: "",
      authed: false,
      pagePath: "/",
      selectedId: "",
      canvasPath: "",
      listening: false,
      viewport: "desktop",
      insertAfterId: "",
      modalMode: "insert",
      editingFieldId: "",
      selectedSection: "",
      selectedSectionInsert: false,
      outlineLock: 0,
      history: { past: [], future: [], coalesce: "", timer: 0, applying: false },
    };

    function el(html) {
      const box = document.createElement("div");
      box.innerHTML = html.trim();
      return box.firstElementChild;
    }

    function pages() {
      return (state.model && state.model.pages) || [];
    }

    function currentPage() {
      return pages().find((page) => page.path === state.pagePath) || pages()[0] || null;
    }

    function isLiveView() {
      return state.view === "edit" || state.view === "sections" || state.view === "siteheader" || state.view === "sitefooter" || state.view === "sitehtml" || state.view === "sitewidgets" || state.view === "menu";
    }

    function preferHome() {
      if (pages().some((page) => page.path === "/")) state.pagePath = "/";
    }

    function ensureScopes() {
      const counts = {};
      const classN = {};
      pages().forEach((page) => {
        const seen = {};
        const seenClass = {};
        (page.sections || []).forEach((sec) => {
          if (sec.id && !seen[sec.id]) {
            seen[sec.id] = 1;
            counts[sec.id] = (counts[sec.id] || 0) + 1;
          }
          if (sec.customClass && !seenClass[sec.customClass]) {
            seenClass[sec.customClass] = 1;
            classN[sec.customClass] = (classN[sec.customClass] || 0) + 1;
          }
        });
      });
      pages().forEach((page) => {
        (page.sections || []).forEach((sec) => {
          const n = counts[sec.id] || 1;
          sec.pageCount = Math.max(n, sec.pageCount || 1);
          const classHits = classN[sec.customClass] || 0;
          const similar = Boolean(sec.similarKey) || classHits >= 2;
          sec.scope = sec.type === "header" || sec.type === "footer" || (sec.type === "html" && (n >= 2 || sec.static)) || similar ? "site" : "page";
        });
      });
    }

    function siteIds() {
      ensureScopes();
      const ids = new Set();
      pages().forEach((page) => {
        (page.sections || []).forEach((sec) => {
          if (sec.scope === "site") ids.add(sec.id);
        });
      });
      return ids;
    }

    function uniqueSiteSections(type) {
      ensureScopes();
      const seen = new Set();
      const out = [];
      pages().slice().sort((a, b) => Number(b.path === "/") - Number(a.path === "/")).forEach((page) => {
        (page.sections || []).forEach((sec) => {
          if (sec.scope !== "site") return;
          if (type && sec.type !== type) return;
          if (seen.has(sec.id)) return;
          seen.add(sec.id);
          out.push(Object.assign({ pagePath: page.path }, sec));
        });
      });
      return out;
    }

    function uniqueSimilarWidgets() {
      ensureScopes();
      const byKey = new Map();
      pages().slice().sort((a, b) => Number(b.path === "/") - Number(a.path === "/")).forEach((page) => {
        (page.sections || []).forEach((sec) => {
          const key = sec.similarKey || (sec.customClass ? sec.customClass + "::" : "");
          if (!key || !sec.customClass) return;
          if (byKey.has(key)) {
            const cur = byKey.get(key);
            cur.pageCount = (cur.pageCount || 1) + 1;
            return;
          }
          byKey.set(key, Object.assign({ pagePath: page.path, pageCount: 1 }, sec));
        });
      });
      return [...byKey.values()];
    }

    function similarSectionIds() {
      const ids = [];
      pages().forEach((page) => {
        (page.sections || []).forEach((sec) => {
          if (sec.customClass || sec.similarKey) ids.push(sec.id);
        });
      });
      return [...new Set(ids)];
    }

    function uniqueHtmlWidgets() {
      const seen = new Map();
      uniqueSiteSections("html").forEach((sec) => {
        const code = (sec.fields || []).filter((field) => field.type === "html" || field.html).map((field) => field.value).join("\n");
        const key = code || sec.id;
        if (!seen.has(key)) seen.set(key, sec);
      });
      return [...seen.values()];
    }

    function codeFieldsOfSection(sectionId) {
      const fields = [];
      pages().forEach((page) => {
        (page.sections || []).forEach((sec) => {
          if (sec.id !== sectionId) return;
          (sec.fields || []).forEach((field) => {
            if (field.type === "html" || field.html) fields.push(Object.assign({ sectionId: sec.id, pagePath: page.path }, field));
          });
        });
      });
      const uniq = [];
      const ids = new Set();
      fields.forEach((field) => {
        if (ids.has(field.nodeId)) return;
        ids.add(field.nodeId);
        uniq.push(field);
      });
      return uniq;
    }

    function newNid() {
      try { return "n-" + crypto.randomUUID(); } catch (err) {}
      return "n-" + "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function nids(count) {
      const out = [];
      for (let i = 0; i < count; i++) out.push(newNid());
      return out;
    }

    function menuInserts() {
      if (!state.content.menuInserts) state.content.menuInserts = [];
      return state.content.menuInserts;
    }

    function menuInsertForNode(id) {
      return menuInserts().find((item) =>
        (item.itemNodeIds || []).includes(id) || (item.textNodeIds || []).includes(id)
      ) || null;
    }

    function menuInsertField(insert) {
      const action = resolveLinkAction(insert);
      return {
        nodeId: (insert.itemNodeIds && insert.itemNodeIds[0]) || insert.id,
        type: "link",
        label: insert.label || "Новая ссылка",
        value: insert.label || "Новая ссылка",
        href: action.href || insert.href || "/",
        pagePath: state.pagePath,
        sectionLabel: "Меню",
        menuInsertId: insert.id,
      };
    }

    function allFields() {
      const out = [];
      pages().forEach((page) => {
        (page.sections || []).forEach((section) => {
          (section.fields || []).forEach((field) => {
            out.push(Object.assign({ pagePath: page.path, sectionLabel: section.label, sectionId: section.id }, field));
          });
        });
      });
      return out;
    }

    function fieldById(id) {
      const insert = menuInsertForNode(id);
      if (insert) return menuInsertField(insert);
      return allFields().find((field) => field.nodeId === id) || null;
    }

    function uniqueMenuLinks() {
      const owned = new Set();
      menuInserts().forEach((item) => {
        (item.itemNodeIds || []).forEach((id) => owned.add(id));
        (item.textNodeIds || []).forEach((id) => owned.add(id));
      });
      const seen = new Set();
      return allFields().filter((field) => {
        if (field.type !== "link" && field.type !== "button") return false;
        if (owned.has(field.nodeId)) return false;
        const blob = ((field.sectionLabel || "") + " " + (field.label || "")).toLowerCase();
        if (!/шапк|меню|header/.test(blob)) return false;
        if ((field.value || "").length > 80) return false;
        if (seen.has(field.nodeId)) return false;
        seen.add(field.nodeId);
        return true;
      });
    }

    function syncMenuInsert(insert, next) {
      insert.label = next.value != null ? next.value : insert.label;
      insert.linkKind = next.linkKind || insert.linkKind;
      insert.linkPage = next.linkPage;
      insert.linkSection = next.linkSection;
      insert.linkUrl = next.linkUrl;
      insert.linkBlank = next.linkBlank;
      insert.linkNofollow = next.linkNofollow;
      insert.linkDownload = next.linkDownload;
      insert.href = next.href;
      (insert.itemNodeIds || []).forEach((nid) => {
        state.content.fields[nid] = Object.assign({}, next, { value: insert.label });
      });
      (insert.textNodeIds || []).forEach((tid) => {
        state.content.fields[tid] = { value: insert.label };
      });
    }

    async function api(path, opts) {
      const res = await fetch(path, Object.assign({ credentials: "same-origin" }, opts));
      const type = res.headers.get("content-type") || "";
      const data = type.includes("json") ? await res.json().catch(() => ({})) : {};
      if (!res.ok) throw new Error(data.error || "Ошибка");
      return data;
    }

    async function login(ev) {
      ev.preventDefault();
      state.error = "";
      try {
        await api("/api/admin/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password: ev.target.password.value }),
        });
        await load();
      } catch (err) {
        state.error = err.message;
        render();
      }
    }

    async function load() {
      try {
        const data = await api("/api/admin/state");
        state.authed = true;
        state.content = data.content;
        state.model = data.model;
        state.leads = data.leads || [];
        if (!state.content.fields) state.content.fields = {};
        if (!state.content.forms) state.content.forms = {};
        if (!state.content.htmlBlocks) state.content.htmlBlocks = [];
        if (!state.content.menuInserts) state.content.menuInserts = [];
        if (!state.content.site) state.content.site = {};
        if (!state.content.pages) state.content.pages = {};
        if (!state.content.sections) state.content.sections = { order: [], hidden: [], removed: [], inserts: [] };
        ensureScopes();
        state.history = { past: [], future: [], coalesce: "", timer: 0, applying: false };
        if (!pages().some((page) => page.path === state.pagePath) && pages()[0]) {
          state.pagePath = pages()[0].path;
        }
      } catch (err) {
        state.authed = false;
        if (err.message !== "Нужна авторизация") state.error = err.message;
      }
      render();
    }

    function overlaySlice() {
      const c = state.content || {};
      return JSON.parse(JSON.stringify({
        fields: c.fields || {},
        forms: c.forms || {},
        htmlBlocks: c.htmlBlocks || [],
        menuInserts: c.menuInserts || [],
        site: c.site || {},
        pages: c.pages || {},
        sections: c.sections || { order: [], hidden: [], removed: [], inserts: [] },
      }));
    }

    function assignOverlay(data) {
      if (!state.content) return;
      state.content.fields = JSON.parse(JSON.stringify(data.fields || {}));
      state.content.forms = JSON.parse(JSON.stringify(data.forms || {}));
      state.content.htmlBlocks = JSON.parse(JSON.stringify(data.htmlBlocks || []));
      state.content.menuInserts = JSON.parse(JSON.stringify(data.menuInserts || []));
      state.content.site = JSON.parse(JSON.stringify(data.site || {}));
      state.content.pages = JSON.parse(JSON.stringify(data.pages || {}));
      state.content.sections = JSON.parse(JSON.stringify(data.sections || { order: [], hidden: [], removed: [], inserts: [] }));
    }

    function paintHistory() {
      const undo = document.getElementById("undo");
      const redo = document.getElementById("redo");
      if (undo) undo.disabled = !state.history.past.length;
      if (redo) redo.disabled = !state.history.future.length;
    }

    function recordChange(coalesceKey) {
      const hist = state.history;
      if (hist.applying || !state.content) return;
      const key = coalesceKey || "";
      if (key && hist.coalesce === key) return;
      hist.past.push(overlaySlice());
      if (hist.past.length > 50) hist.past.shift();
      hist.future = [];
      hist.coalesce = key;
      if (hist.timer) window.clearTimeout(hist.timer);
      hist.timer = window.setTimeout(() => {
        hist.coalesce = "";
      }, 700);
      paintHistory();
    }

    async function applyHistory(data) {
      const hist = state.history;
      hist.applying = true;
      hist.coalesce = "";
      assignOverlay(data);
      hist.applying = false;
      paintInspector();
      paintOutline();
      if (!isLiveView()) fillPanel();
      paintHistory();
      await save();
      state.status = "Черновик восстановлен";
      paintStatus();
    }

    async function undoOverlay() {
      const hist = state.history;
      if (!hist.past.length) return;
      hist.future.push(overlaySlice());
      await applyHistory(hist.past.pop());
    }

    async function redoOverlay() {
      const hist = state.history;
      if (!hist.future.length) return;
      hist.past.push(overlaySlice());
      await applyHistory(hist.future.pop());
    }

    function setField(id, original, next, opts) {
      recordChange("field:" + id);
      const meta = fieldById(id);
      if (meta && (meta.html || meta.type === "html")) next.innerHtml = true;
      const insert = menuInsertForNode(id);
      const action = resolveLinkAction(next);
      if (action.apply && action.href) next.href = action.href;
      if (insert) {
        syncMenuInsert(insert, next);
      } else {
        const href = next.href || "";
        const same = (next.value || "") === original && !href && !next.linkKind;
        if (same) delete state.content.fields[id];
        else state.content.fields[id] = next;
      }
      if (opts && opts.fromCanvas) {
        syncInspectorField(id);
        return;
      }
      const frame = document.getElementById("canvas");
      if (frame && frame.contentWindow) {
        const target = insert && insert.itemNodeIds && insert.itemNodeIds[0] ? insert.itemNodeIds[0] : id;
        frame.contentWindow.postMessage(
          {
            source: "craft-host",
            nodeId: target,
            patch: Object.assign({}, next, {
              href: next.href,
              target: action.target || "",
              rel: action.rel || "",
              download: action.download,
            }),
          },
          "*",
        );
        (insert && insert.textNodeIds ? insert.textNodeIds : []).forEach((tid) => {
          frame.contentWindow.postMessage(
            { source: "craft-host", nodeId: tid, patch: { value: next.value } },
            "*",
          );
        });
      }
    }

    function syncInspectorField(id) {
      if (state.selectedId !== id) return;
      const box = document.getElementById("inspector");
      if (!box) return;
      const input = box.querySelector("input, textarea");
      if (!input || document.activeElement === input) return;
      const field = fieldById(id);
      const patch = state.content.fields[id] || {};
      input.value = patch.value != null ? patch.value : (field ? field.value : input.value);
    }

    function selectField(id) {
      state.selectedId = id;
      const field = fieldById(id);
      if (field && field.pagePath) state.pagePath = field.pagePath;
      if (field && field.sectionId) {
        state.selectedSection = field.sectionId;
        state.selectedSectionInsert = false;
        paintOutline();
      }
      paintInspector();
      const frame = document.getElementById("canvas");
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ source: "craft-host", highlight: id }, "*");
      }
    }

    async function save() {
      state.error = "";
      try {
        state.content = await api("/api/admin/content", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            fields: state.content.fields,
            forms: state.content.forms,
            htmlBlocks: state.content.htmlBlocks,
            menuInserts: state.content.menuInserts || [],
            site: state.content.site || {},
            pages: state.content.pages || {},
            sections: state.content.sections || { order: [], hidden: [], removed: [], inserts: [] },
          }),
        });
        state.status = "Черновик сохранён";
        reloadCanvas(true);
      } catch (err) {
        state.error = err.message;
      }
      paintStatus();
    }

    async function publish() {
      await save();
      try {
        const data = await api("/api/admin/publish", { method: "POST" });
        state.status = "Опубликовано файлов: " + data.files;
      } catch (err) {
        state.error = err.message;
      }
      paintStatus();
    }

    function canvasUrl() {
      const page = currentPage();
      return "/api/admin/page-html?path=" + encodeURIComponent(page ? page.path : "/");
    }

    function paintModeHint() {
      const node = document.getElementById("mode-hint");
      if (!node) return;
      const hints = {
        siteheader: "На канвасе только шапка · правка уходит на все страницы",
        sitefooter: "На канвасе только подвал · правка уходит на все страницы",
        sitehtml: "На канвасе только HTML-код · правьте справа или кнопкой «Редактировать код»",
        sitewidgets: "На канвасе только виджет .pic · правка ссылок и картинок уходит на все страницы",
        menu: "На канвасе только шапка с меню · клик по пункту или список справа",
        sections: "Секции этой страницы",
        edit: "",
      };
      node.textContent = hints[state.view] || "";
    }

    function canvasFocus() {
      if (state.view === "siteheader" || state.view === "menu") {
        return { mode: "header", keepIds: uniqueSiteSections("header").map((sec) => sec.id) };
      }
      if (state.view === "sitefooter") {
        return { mode: "footer", keepIds: uniqueSiteSections("footer").map((sec) => sec.id) };
      }
      if (state.view === "sitehtml") {
        return { mode: "html", keepIds: uniqueSiteSections("html").map((sec) => sec.id) };
      }
      if (state.view === "sitewidgets") {
        return { mode: "widget", keepIds: similarSectionIds() };
      }
      return { mode: "" };
    }

    function revealCanvas() {
      const frame = document.getElementById("canvas");
      if (!frame || !frame.contentWindow) return;
      const chrome = state.view === "sections" || state.view === "siteheader" || state.view === "sitefooter" || state.view === "menu";
      const focus = canvasFocus();
      frame.contentWindow.postMessage({ source: "craft-host", sectionChrome: chrome, focus }, "*");
      if (state.selectedSection && focus.mode !== "html") {
        frame.contentWindow.postMessage({
          source: "craft-host",
          revealSection: { id: state.selectedSection, insert: state.selectedSectionInsert },
        }, "*");
      }
    }

    async function reloadCanvas(force) {
      const frame = document.getElementById("canvas");
      if (!frame || !isLiveView()) return;
      const next = canvasUrl();
      if (state.canvasPath === next && frame.contentWindow && frame.contentDocument && frame.contentDocument.readyState === "complete") {
        revealCanvas();
        if (!force) return;
      }
      if (!force && state.canvasPath === next) {
        revealCanvas();
        return;
      }
      state.canvasPath = next;
      try {
        const t0 = Date.now();
        const res = await fetch(next, { credentials: "same-origin" });
        const text = await res.text();
        dbg("page-html " + res.status + " " + text.length + "b " + (Date.now() - t0) + "ms" + (res.ok ? "" : " " + text.slice(0, 80)));
        dbg("inject canvas.js=" + (text.indexOf("/__craft/canvas.js") >= 0) + " data=" + (text.indexOf("craft-canvas-data") >= 0));
        const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
        let m;
        let i = 0;
        while ((m = re.exec(text))) {
          const attrs = m[1] || "";
          const body = m[2] || "";
          if (/src=/i.test(attrs) || /application\/json/i.test(attrs)) continue;
          if (!body.trim()) continue;
          i += 1;
          try {
            new Function(body);
          } catch (err) {
            dbg("iframe inline#" + i + " " + err.message);
          }
        }
      } catch (err) {
        dbg("page-html FAIL " + err.message);
      }
      frame.src = next;
    }

    function isFlowHtmlBlock(block) {
      return block && (block.position === "before" || block.position === "after");
    }

    function insertSlotKey(item) {
      return item.afterId || "";
    }

    function moveSectionInsert(inserts, id, dir, sectionOrder) {
      const next = inserts.slice();
      const item = next.find((block) => block.id === id);
      if (!item) return next;
      const key = insertSlotKey(item);
      const slot = next.filter((block) => insertSlotKey(block) === key);
      const slotIndex = slot.findIndex((block) => block.id === id);
      const swapWith =
        dir === "up" && slotIndex > 0
          ? slot[slotIndex - 1]
          : dir === "down" && slotIndex < slot.length - 1
            ? slot[slotIndex + 1]
            : null;
      if (swapWith) {
        const i = next.findIndex((block) => block.id === item.id);
        const j = next.findIndex((block) => block.id === swapWith.id);
        const tmp = next[i];
        next[i] = next[j];
        next[j] = tmp;
        return next;
      }
      const slots = [""].concat(sectionOrder.filter(Boolean));
      const cur = slots.indexOf(key);
      if (dir === "up") {
        if (cur <= 0) return next;
        item.afterId = slots[cur - 1] || undefined;
      } else if (cur < 0 || cur >= slots.length - 1) {
        return next;
      } else {
        item.afterId = slots[cur + 1] || undefined;
      }
      const from = next.findIndex((block) => block.id === id);
      next.splice(from, 1);
      const newKey = insertSlotKey(item);
      if (dir === "up") {
        let insertAt = 0;
        for (let i = 0; i < next.length; i++) {
          if (insertSlotKey(next[i]) === newKey) insertAt = i + 1;
        }
        next.splice(insertAt, 0, item);
      } else {
        const first = next.findIndex((block) => insertSlotKey(block) === newKey);
        next.splice(first < 0 ? next.length : first, 0, item);
      }
      return next;
    }

    function moveHtmlBlock(id, dir) {
      const blocks = state.content.htmlBlocks || [];
      const block = blocks.find((item) => item.id === id);
      if (!isFlowHtmlBlock(block)) return;
      const order = ensureSections().order.filter((secId) => !(ensureSections().removed || []).includes(secId));
      const slot = blocks.filter((item) => isFlowHtmlBlock(item) && item.sectionId === block.sectionId && item.position === block.position);
      const slotIndex = slot.findIndex((item) => item.id === id);
      const swapWith = dir === "up" && slotIndex > 0 ? slot[slotIndex - 1] : dir === "down" && slotIndex < slot.length - 1 ? slot[slotIndex + 1] : null;
      if (swapWith) {
        const i = blocks.findIndex((item) => item.id === block.id);
        const j = blocks.findIndex((item) => item.id === swapWith.id);
        const tmp = blocks[i];
        blocks[i] = blocks[j];
        blocks[j] = tmp;
        return;
      }
      const si = order.indexOf(block.sectionId);
      if (dir === "up") {
        if (block.position === "after") block.position = "before";
        else if (si > 0) {
          block.sectionId = order[si - 1];
          block.position = "after";
        }
      } else if (block.position === "before") {
        block.position = "after";
      } else if (si >= 0 && si < order.length - 1) {
        block.sectionId = order[si + 1];
        block.position = "before";
      }
    }

    async function applyHtmlBlockAction(payload) {
      const blocks = state.content.htmlBlocks || [];
      const block = blocks.find((item) => item.id === payload.id);
      if (!block) return;
      if (payload.action === "up" || payload.action === "down") {
        recordChange();
        moveHtmlBlock(payload.id, payload.action);
        await save();
        return;
      }
      if (payload.action === "hide") {
        recordChange();
        block.hidden = !block.hidden;
        await save();
        return;
      }
      if (payload.action === "remove") {
        if (!confirm("Удалить HTML-блок из патча?")) return;
        recordChange();
        state.content.htmlBlocks = blocks.filter((item) => item.id !== payload.id);
        await save();
      }
    }

    async function applySectionAction(payload) {
      const layout = ensureSections();
      const id = payload.id;
      const action = payload.action;
      if (payload.insert) {
        if (action === "up" || action === "down") {
          recordChange();
          const order = layout.order.filter((secId) => !(layout.removed || []).includes(secId));
          layout.inserts = moveSectionInsert(layout.inserts || [], id, action, order);
          await save();
          return;
        }
        if (action === "remove") {
          recordChange();
          layout.inserts = (layout.inserts || []).filter((item) => item.id !== id);
          await save();
        } else if (action === "insert") {
          const item = (layout.inserts || []).find((block) => block.id === id);
          openInsertModal(item && item.afterId);
        }
        return;
      }
        if (action === "insert") {
          openInsertModal(id);
          return;
        }
        if (action === "editcode") {
          const fields = codeFieldsOfSection(id);
          if (!fields.length) {
            state.status = "В этой секции нет поля «Код»";
            paintStatus();
            return;
          }
          openCodeModal(fields[0]);
          return;
        }
      if (action === "up") {
        const from = layout.order.indexOf(id);
        if (from < 1) return;
        recordChange();
        const swap = layout.order[from - 1];
        layout.order[from - 1] = id;
        layout.order[from] = swap;
      } else if (action === "down") {
        const from = layout.order.indexOf(id);
        if (from < 0 || from >= layout.order.length - 1) return;
        recordChange();
        const swap = layout.order[from + 1];
        layout.order[from + 1] = id;
        layout.order[from] = swap;
      } else if (action === "hide") {
        recordChange();
        if (layout.hidden.includes(id)) layout.hidden = layout.hidden.filter((x) => x !== id);
        else layout.hidden.push(id);
      } else if (action === "remove") {
        if (!confirm("Удалить секцию из патча? HTML на диске останется, на сайте её не будет.")) return;
        recordChange();
        layout.removed.push(id);
        layout.order = layout.order.filter((x) => x !== id);
      } else {
        return;
      }
      await save();
    }

    async function confirmInsertHtml() {
      const area = document.getElementById("insert-html");
      const html = area ? area.value.trim() : "";
      if (!html) return;
      if (state.modalMode === "code" && state.editingFieldId) {
        const field = fieldById(state.editingFieldId) || { nodeId: state.editingFieldId, value: "", html: true, type: "html" };
        setField(state.editingFieldId, field.value, { value: html, innerHtml: true });
        closeInsertModal();
        await save();
        return;
      }
      recordChange();
      const layout = ensureSections();
      layout.inserts.push({
        id: "sec-" + Date.now().toString(36),
        afterId: state.insertAfterId || undefined,
        html,
      });
      closeInsertModal();
      await save();
    }

    function currentPageSeo() {
      const path = (currentPage() && currentPage().path) || "/";
      if (!state.content.pages) state.content.pages = {};
      if (!state.content.pages[path]) state.content.pages[path] = {};
      return { path, seo: state.content.pages[path] };
    }

    function ensureSections() {
      if (!state.content.sections) state.content.sections = { order: [], hidden: [], removed: [], inserts: [] };
      const s = state.content.sections;
      if (!Array.isArray(s.order)) s.order = [];
      if (!Array.isArray(s.hidden)) s.hidden = [];
      if (!Array.isArray(s.removed)) s.removed = [];
      if (!Array.isArray(s.inserts)) s.inserts = [];
      const ids = ((currentPage() && currentPage().sections) || []).map((sec) => sec.id);
      if (!s.order.length) s.order = ids.slice();
      ids.forEach((id) => {
        if (!s.order.includes(id) && !s.removed.includes(id)) s.order.push(id);
      });
      return s;
    }

    function labeledInput(caption, multiline, getter, setter) {
      const lab = el("<label><span></span></label>");
      lab.querySelector("span").textContent = caption;
      const input = document.createElement(multiline ? "textarea" : "input");
      input.value = getter() || "";
      input.addEventListener("input", () => {
        recordChange("input:" + caption);
        setter(input.value);
      });
      lab.appendChild(input);
      return lab;
    }

    function formInput(form) {

    function inferLinkKind(href, download) {
      const h = String(href || "").trim();
      if (download) return "file";
      if (/^tel:/i.test(h)) return "tel";
      if (/^mailto:/i.test(h)) return "mailto";
      if (h.indexOf("#") >= 0 && h !== "#") return "anchor";
      if (!h || h === "#" || h.charAt(0) === "/" || h.charAt(0) === ".") return "page";
      return "external";
    }

    function resolveLinkAction(patch) {
      if (!patch.linkKind && (patch.href == null || patch.href === "")) return { apply: false };
      const kind = patch.linkKind || inferLinkKind(patch.href, Boolean(patch.linkDownload));
      let href = "";
      if (kind === "page") {
        href = patch.linkPage || patch.href || "/";
        if (href === "#") href = "/";
      } else if (kind === "anchor") {
        const page = patch.linkPage && patch.linkPage !== "/" ? String(patch.linkPage).replace(/\/?$/, "/") : "";
        const hash = String(patch.linkSection || "").replace(/^#/, "");
        href = hash ? (page + "#" + hash) : (page || "/");
      } else if (kind === "tel") {
        href = "tel:" + String(patch.linkUrl || patch.href || "").replace(/^tel:/i, "").replace(/[^\d+]/g, "");
      } else if (kind === "mailto") {
        href = "mailto:" + String(patch.linkUrl || patch.href || "").replace(/^mailto:/i, "").trim();
      } else {
        href = patch.linkUrl || patch.href || "";
      }
      const blank = Boolean(patch.linkBlank) && (kind === "external" || kind === "file");
      const rel = [blank ? "noopener noreferrer" : "", patch.linkNofollow ? "nofollow" : ""].filter(Boolean).join(" ").trim();
      return { apply: true, href: href, target: blank ? "_blank" : "", rel: rel, download: kind === "file" || Boolean(patch.linkDownload) };
    }

    function parseHrefParts(href) {
      const h = String(href || "");
      const i = h.indexOf("#");
      if (i >= 0) return { page: h.slice(0, i) || "/", section: h.slice(i + 1) };
      return { page: h || "/", section: "" };
    }

    function phoneDigits(raw) {
      let d = String(raw || "").replace(/^tel:/i, "").replace(/\D/g, "");
      if (!d) return "";
      if (d.charAt(0) === "8") d = "7" + d.slice(1);
      if (d.charAt(0) !== "7") d = "7" + d;
      return d.slice(0, 11);
    }

    function formatPhone(raw) {
      const d = phoneDigits(raw);
      const rest = d.charAt(0) === "7" ? d.slice(1) : d;
      if (!rest) return "+7 (";
      let out = "+7 (" + rest.slice(0, 3);
      if (rest.length >= 3) out += ")";
      if (rest.length > 3) out += " " + rest.slice(3, 6);
      if (rest.length > 6) out += "-" + rest.slice(6, 8);
      if (rest.length > 8) out += "-" + rest.slice(8, 10);
      return out;
    }

    function applyPhoneMask(input) {
      const caretDigits = String(input.value || "").slice(0, input.selectionStart || 0).replace(/\D/g, "").length;
      const formatted = formatPhone(input.value);
      input.value = formatted;
      let seen = 0;
      let pos = formatted.length;
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted.charAt(i))) {
          seen += 1;
          if (seen >= caretDigits) {
            pos = i + 1;
            break;
          }
        }
      }
      try { input.setSelectionRange(pos, pos); } catch (err) {}
    }

    function maskEmail(raw) {
      return String(raw || "").replace(/^mailto:/i, "").replace(/\s+/g, "").toLowerCase().replace(/[^a-z0-9._%+\-@]/g, "");
    }

    function isLinkField(field) {
      return field.type === "link" || field.type === "button" || field.type === "phone";
    }

    function commitLinkField(field, textValue, extras) {
      const prev = state.content.fields[field.nodeId] || {};
      const next = Object.assign({}, prev, extras, { value: textValue });
      setField(field.nodeId, field.value, next);
    }

    function linkActionPanel(field, textInput) {
      const patch = state.content.fields[field.nodeId] || {};
      const href = patch.href != null ? patch.href : (field.href || "");
      const parts = parseHrefParts(href);
      let kind = patch.linkKind || (field.type === "phone" ? "tel" : inferLinkKind(href, Boolean(field.download || patch.linkDownload)));
      if (href === "#" && !patch.linkKind) kind = "page";
      const box = el('<div class="card" style="margin-top:10px"></div>');
      box.appendChild(el('<div class="muted">Действие клика</div>'));
      const kindLab = el("<label><span>Тип</span></label>");
      const kindSel = document.createElement("select");
      [
        ["page", "Страница сайта"],
        ["anchor", "Якорь на секцию"],
        ["external", "Внешняя ссылка"],
        ["tel", "Телефон"],
        ["mailto", "Почта"],
        ["file", "Файл / скачать"],
      ].forEach((pair) => {
        const opt = document.createElement("option");
        opt.value = pair[0];
        opt.textContent = pair[1];
        kindSel.appendChild(opt);
      });
      kindSel.value = kind;
      kindLab.appendChild(kindSel);
      box.appendChild(kindLab);
      const extras = el("<div></div>");
      box.appendChild(extras);

      function currentText() {
        return textInput ? textInput.value : (patch.value != null ? patch.value : field.value);
      }

      function commit() {
        const k = kindSel.value;
        const next = { linkKind: k };
        const pageSel = extras.querySelector("[data-k=page]");
        const secSel = extras.querySelector("[data-k=sec]");
        const urlIn = extras.querySelector("[data-k=url]");
        const blank = extras.querySelector("[data-k=blank]");
        const nofollow = extras.querySelector("[data-k=nofollow]");
        if (k === "page" || k === "anchor") next.linkPage = pageSel ? pageSel.value : "/";
        if (k === "anchor") next.linkSection = secSel ? secSel.value : "";
        if (k === "external" || k === "file" || k === "tel" || k === "mailto") next.linkUrl = urlIn ? urlIn.value : "";
        next.linkBlank = Boolean(blank && blank.checked);
        next.linkNofollow = Boolean(nofollow && nofollow.checked);
        next.linkDownload = k === "file";
        commitLinkField(field, currentText(), next);
      }

      function fillExtras() {
        const keepPage = extras.querySelector("[data-k=page]") ? extras.querySelector("[data-k=page]").value : "";
        const keepSec = extras.querySelector("[data-k=sec]") ? extras.querySelector("[data-k=sec]").value : "";
        extras.innerHTML = "";
        const k = kindSel.value;
        if (k === "page" || k === "anchor") {
          const lab = el("<label><span>Страница</span></label>");
          const sel = document.createElement("select");
          sel.setAttribute("data-k", "page");
          pages().forEach((page) => {
            const opt = document.createElement("option");
            opt.value = page.path;
            opt.textContent = (page.title || page.path) + " · " + page.path;
            sel.appendChild(opt);
          });
          sel.value = keepPage || patch.linkPage || parts.page || (currentPage() && currentPage().path) || "/";
          if (!Array.prototype.some.call(sel.options, (o) => o.value === sel.value) && sel.options[0]) sel.value = sel.options[0].value;
          sel.addEventListener("change", () => {
            if (kindSel.value === "anchor") fillExtras();
            commit();
          });
          lab.appendChild(sel);
          extras.appendChild(lab);
        }
        if (k === "anchor") {
          const lab = el("<label><span>Секция</span></label>");
          const sel = document.createElement("select");
          sel.setAttribute("data-k", "sec");
          const pagePath = extras.querySelector("[data-k=page]") ? extras.querySelector("[data-k=page]").value : "/";
          const page = pages().find((item) => item.path === pagePath) || currentPage();
          ((page && page.sections) || []).forEach((sec) => {
            const opt = document.createElement("option");
            opt.value = sec.id;
            opt.textContent = sec.label || sec.id;
            sel.appendChild(opt);
          });
          sel.value = keepSec || patch.linkSection || parts.section;
          sel.addEventListener("change", commit);
          lab.appendChild(sel);
          extras.appendChild(lab);
        }
        if (k === "external" || k === "file" || k === "tel" || k === "mailto") {
          const lab = el("<label><span></span></label>");
          lab.querySelector("span").textContent = k === "tel" ? "Телефон" : k === "mailto" ? "Email" : "Адрес";
          const url = document.createElement("input");
          url.setAttribute("data-k", "url");
          if (k === "tel") {
            url.type = "tel";
            url.inputMode = "tel";
            url.autocomplete = "tel";
            url.placeholder = "+7 (900) 000-00-00";
            url.value = formatPhone(patch.linkUrl || href);
            url.addEventListener("input", () => { applyPhoneMask(url); commit(); });
          } else if (k === "mailto") {
            url.type = "email";
            url.autocomplete = "email";
            url.placeholder = "name@domain.ru";
            url.value = maskEmail(patch.linkUrl || href);
            url.addEventListener("input", () => { url.value = maskEmail(url.value); commit(); });
          } else {
            url.placeholder = k === "file" ? "https://…/file.pdf" : "https://";
            url.value = patch.linkUrl || href;
            url.addEventListener("input", commit);
          }
          lab.appendChild(url);
          extras.appendChild(lab);
        }
        if (k === "external" || k === "file") {
          const row = el('<label style="display:flex;align-items:center;gap:8px;text-transform:none"></label>');
          const blank = document.createElement("input");
          blank.type = "checkbox";
          blank.setAttribute("data-k", "blank");
          blank.checked = Boolean(patch.linkBlank);
          blank.addEventListener("change", commit);
          row.appendChild(blank);
          row.appendChild(document.createTextNode("Новое окно"));
          extras.appendChild(row);
          const row2 = el('<label style="display:flex;align-items:center;gap:8px;text-transform:none"></label>');
          const nf = document.createElement("input");
          nf.type = "checkbox";
          nf.setAttribute("data-k", "nofollow");
          nf.checked = Boolean(patch.linkNofollow);
          nf.addEventListener("change", commit);
          row2.appendChild(nf);
          row2.appendChild(document.createTextNode("nofollow"));
          extras.appendChild(row2);
        }
      }
      kindSel.addEventListener("change", () => { fillExtras(); commit(); });
      fillExtras();
      return box;
    }

    function fieldInput(field) {
      const patch = state.content.fields[field.nodeId] || {};
      const value = patch.value != null ? patch.value : field.value;
      const wrap = document.createElement("div");
      const lab = el("<label><span></span></label>");
      lab.querySelector("span").textContent = field.type + " · " + field.label;
      const input = document.createElement(field.type === "textarea" || field.type === "html" ? "textarea" : "input");
      if (field.type === "image") input.placeholder = "URL картинки";
      if (field.type === "phone") {
        input.type = "tel";
        input.inputMode = "tel";
        input.placeholder = "+7 (900) 000-00-00";
        input.value = formatPhone(value);
      } else {
        input.value = value;
      }
      input.addEventListener("input", () => {
        if (field.type === "phone") applyPhoneMask(input);
        const prev = state.content.fields[field.nodeId] || {};
        const next = Object.assign({}, prev, { value: input.value });
        if (field.type === "image") next.src = input.value;
        if (field.type === "phone" && !prev.linkKind) {
          next.linkKind = "tel";
          next.linkUrl = input.value;
        }
        setField(field.nodeId, field.value, next);
      });
      lab.appendChild(input);
      wrap.appendChild(lab);
      if (isLinkField(field)) wrap.appendChild(linkActionPanel(field, input));
      return wrap;
    }

          <button data-nav="sections" type="button">Секции</button>
          <button data-nav="siteheader" type="button">Шапка</button>
          <button data-nav="sitefooter" type="button">Подвал</button>
          <button data-nav="sitehtml" type="button">HTML-код</button>
          <button data-nav="sitewidgets" type="button">Виджеты</button>
          <button data-nav="seo" type="button">SEO / сайт</button>
          <button data-nav="menu" type="button">Меню</button>
          <button data-nav="leads" type="button">Заявки</button>
          <button data-nav="blocks" type="button">HTML-блоки</button>
          <button data-nav="fields" type="button">Все поля</button>
          <span class="grow"></span>
          <span id="status"></span>
          <button id="undo" type="button" disabled title="Ctrl+Z">Отменить</button>
          <button id="redo" type="button" disabled title="Ctrl+Shift+Z">Повторить</button>
          <button class="primary" id="save" type="button">Сохранить</button>
          <button class="ghost" id="pub" type="button">Опубликовать</button>
          <button data-nav="out" type="button">Выйти</button>
        </header>
        <div class="work">
          <aside class="pages">
            <div class="muted" style="margin-bottom:8px">Страницы</div>
            <div id="page-list"></div>
            <div class="muted" style="margin:12px 0 8px">Секции</div>
            <div id="outline-list"></div>
          </aside>
          <div class="stage">
            <div class="stage-bar" id="stage-bar">
              <button data-vp-btn="desktop" type="button">Компьютер</button>
              <button data-vp-btn="mobile" type="button">Телефон</button>
              <span id="mode-hint" class="muted"></span>
              <span class="grow"></span>
              <button id="insert-start" type="button">+ секция в начало</button>
            </div>
            <div class="stage-frame" id="stage-frame" data-vp="desktop">
              <iframe id="canvas" title="Страница"></iframe>
            </div>
            <div class="panel" id="panel" style="display:none"></div>
          </div>
          <aside class="side" id="inspector"></aside>
        </div>
        <div class="modal" id="insert-modal">
          <div class="card">
            <h2 id="insert-title" style="margin:0 0 8px;font-size:16px">Вставить секцию HTML</h2>
            <p class="hint" id="insert-hint">Код вставится патчем поверх страницы, не как блок конструктора.</p>
            <label><span>HTML</span><textarea id="insert-html" placeholder="section.cli-block или любой HTML-виджет"></textarea></label>
            <div class="row">
              <button type="button" id="insert-cancel">Отмена</button>
              <button class="primary" type="button" id="insert-ok">Вставить</button>
            </div>
          </div>
        </div>
      </div>`);
      document.getElementById("app").innerHTML = "";
      const modal = root.querySelector("#insert-modal");
      document.getElementById("app").appendChild(root);
      if (modal) document.getElementById("app").appendChild(modal);
      root.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (btn.getAttribute("data-nav") === "out") {
            await api("/api/admin/logout", { method: "POST" });
            state.authed = false;
            render();
            return;
          }
          state.view = btn.getAttribute("data-nav");
          if (state.view === "siteheader" || state.view === "sitefooter" || state.view === "sitehtml" || state.view === "sitewidgets" || state.view === "menu") {
            preferHome();
            const type = state.view === "sitefooter" ? "footer" : "header";
            if (state.view !== "sitehtml" && state.view !== "sitewidgets") {
              const sec = uniqueSiteSections(type)[0];
              if (sec) {
                state.selectedSection = sec.id;
                state.selectedSectionInsert = false;
              }
            }
            if (state.view === "sitewidgets") {
              const sec = uniqueSimilarWidgets()[0];
              if (sec) {
                state.selectedSection = sec.id;
                state.selectedSectionInsert = false;
              }
            }
          }
          paintNav();
          showStage();
          if (isLiveView()) reloadCanvas(true);
          paintInspector();
        });
      });
      root.querySelector("#save").addEventListener("click", save);
      root.querySelector("#pub").addEventListener("click", publish);
      root.querySelector("#undo").addEventListener("click", () => undoOverlay());
      root.querySelector("#redo").addEventListener("click", () => redoOverlay());
      root.querySelectorAll("[data-vp-btn]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.viewport = btn.getAttribute("data-vp-btn");
          paintViewport();
        });
      });
      document.getElementById("insert-start").addEventListener("click", () => openInsertModal(""));
      document.getElementById("insert-cancel").addEventListener("click", closeInsertModal);
      document.getElementById("insert-ok").addEventListener("click", () => confirmInsertHtml());
      document.getElementById("insert-modal").addEventListener("click", (ev) => {
        if (ev.target.id === "insert-modal") closeInsertModal();
      });
      if (!state.listening) {
        state.listening = true;
        window.addEventListener("message", (event) => {
          if (!event.data || event.data.source !== "craft-canvas") return;
          if (event.data.outline && event.data.outline.id) {
            if (event.data.outline.spy && Date.now() < state.outlineLock) return;
            state.selectedSection = event.data.outline.id;
            state.selectedSectionInsert = Boolean(event.data.outline.insert);
            paintOutline();
            return;
          }
          if (event.data.history === "undo") {
            undoOverlay();
            return;
          }
          if (event.data.history === "redo") {
            redoOverlay();
            return;
          }
          if (event.data.htmlBlockAction) {
            applyHtmlBlockAction(event.data.htmlBlockAction);
            return;
          }
          if (event.data.sectionAction) {
            applySectionAction(event.data.sectionAction);
            return;
          }
          if (event.data.nodeId && event.data.patch) {
            const prev = state.content.fields[event.data.nodeId] || {};
            const field = fieldById(event.data.nodeId);
            const next = Object.assign({}, prev, {
              value: event.data.patch.value != null ? event.data.patch.value : (prev.value != null ? prev.value : (field && field.value) || ""),
            });
            if (!prev.linkKind && event.data.patch.href) next.href = event.data.patch.href;
            if (field) setField(event.data.nodeId, field.value, next, { fromCanvas: true });
            if (state.selectedId !== event.data.nodeId) selectField(event.data.nodeId);
            return;
          }
          if (event.data.nodeId) selectField(event.data.nodeId);
        });
        window.addEventListener("keydown", (event) => {
          if (!state.authed) return;
          const modal = document.getElementById("insert-modal");
          if (modal && modal.classList.contains("on")) return;
          const key = (event.key || "").toLowerCase();
          if (!(event.ctrlKey || event.metaKey)) return;
          if (key === "z") {
            event.preventDefault();
            if (event.shiftKey) redoOverlay();
            else undoOverlay();
          } else if (key === "y") {
            event.preventDefault();
            redoOverlay();
          }
        });
      }
      const frame = root.querySelector("#canvas");
      frame.addEventListener("load", () => {
        if (!frame.contentWindow) return;
        revealCanvas();
        if (state.selectedId) {
          frame.contentWindow.postMessage({ source: "craft-host", highlight: state.selectedId }, "*");
        }
      });
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = "";
      const box = el(`<main class="login">
        <h1>Редактор страниц</h1>
        <p class="muted">Пароль из файла .env (ADMIN_PASSWORD)</p>
        <form>
          <label><span>Пароль</span><input name="password" type="password" required></label>
          <p class="err"></p>
          <button class="primary" type="submit">Войти</button>
        </form>
      </main>`);
      if (state.error) box.querySelector(".err").textContent = state.error;
      box.querySelector("form").addEventListener("submit", login);
      document.getElementById("app").appendChild(box);
    }

    function render() {
      if (!state.authed) {
        renderLogin();
        return;
      }
      mountShell();
      paintNav();
      paintPages();
      paintOutline();
      paintStatus();
      paintHistory();
      paintInspector();
      showStage();
      if (isLiveView()) reloadCanvas(false);
    }

    load();
  </script>
</body>
</html>
